# Lekhira Writes — tests the server (on SQLite and on a real Postgres), then publishes the
# browser-only preview to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Actions are pinned to exact commits (a moved tag can't change what runs); Dependabot
# proposes updates (.github/dependabot.yml).
name: Publish preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # A throwaway Postgres for the tests, like the Supabase database the server uses live.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: lekhira-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # the job never pushes, so leave no token in .git
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install the exact package versions
        run: npm ci
      - name: Test the server and its security rules (SQLite)
        run: npm test
      - name: Test the same rules on Postgres
        run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://postgres:lekhira-ci@localhost:5432/postgres
      - name: Build the Pages preview
        run: npm run pages
        env:
          # Served at the root of writes.lekhira.com (the custom domain under Settings → Pages).
          PAGES_BASE: ""
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
